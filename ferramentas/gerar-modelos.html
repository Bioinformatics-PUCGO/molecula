<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gerador dos modelos 3D (.glb) — fotos</title>
<!-- Ferramenta da equipe: gera os arquivos .glb dos objetos de foto em escala real.
     Abra este arquivo por um servidor (ex.: python3 -m http.server) e clique em "Baixar".
     Coloque os .glb baixados em assets/models/. Não é usada pelos alunos. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>body{font:16px system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#10263a}button{font:inherit;padding:10px 16px;margin:4px;border-radius:10px;border:1px solid #0b78a5;background:#0b78a5;color:#fff;cursor:pointer}code{background:#eef4f9;padding:2px 6px;border-radius:6px}li{margin:8px 0}</style>
</head>
<body>
<h1>Modelos 3D das fotos</h1>
<p id="status">Montando os modelos…</p>
<ul id="lista"></ul>
<script type="module">
import * as THREE from "three";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
import { criarCelular, criarFoto51, criarCromossomo } from "../assets/js/modelos-fotos.js";

const carregar = src => new Promise((ok, er) => { const i = new Image(); i.onload = () => ok(i); i.onerror = er; i.src = src; });
const logos = { cegen: await carregar("../assets/logo-cegen.png"), genia: await carregar("../assets/logo-genia.png") };
const MODELOS = { "celular-gigante": criarCelular({ logos }), "foto-51-rosalind-franklin": criarFoto51(), "cromossomo-gigante": criarCromossomo() };
const glb = obj => new Promise((res, rej) => new GLTFExporter().parse(obj, res, rej, { binary: true }));
const b64 = buf => { let s = ""; const u = new Uint8Array(buf); for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

window.__modelos = MODELOS;
window.__gerar = async () => {
  const out = {};
  for(const [nome, obj] of Object.entries(MODELOS)){
    const buf = await glb(obj), caixa = new THREE.Box3().setFromObject(obj), t = caixa.getSize(new THREE.Vector3());
    out[nome] = { bytes: buf.byteLength, largura: +t.x.toFixed(3), altura: +t.y.toFixed(3), profundidade: +t.z.toFixed(3), minY: +caixa.min.y.toFixed(3), b64: b64(buf), buf };
  }
  return out;
};
const dados = await window.__gerar();
document.getElementById("status").textContent = "Pronto. Clique para baixar cada arquivo e salve em assets/models/.";
for(const [nome, d] of Object.entries(dados)){
  const li = document.createElement("li"), b = document.createElement("button");
  b.textContent = `Baixar ${nome}.glb`;
  b.onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([d.buf], { type: "model/gltf-binary" })); a.download = nome + ".glb"; a.click(); };
  li.append(b, ` ${(d.bytes / 1024).toFixed(0)} KB · ${d.largura} × ${d.altura} × ${d.profundidade} m`); document.getElementById("lista").appendChild(li);
}
window.__pronto = true;
</script>
</body>
</html>
